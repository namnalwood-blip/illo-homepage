<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지식산업센터 오피스인테리어 포트폴리오 — 일로디자인 ILLO DESIGN</title>
<meta name="description" content="일로디자인 지식산업센터 오피스인테리어 시공사진 갤러리.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FBF3E9; --surface:#FFFFFF; --surface-2:#F5E6D3;
    --ink:#2E2A20; --ink-soft:#6E6252; --ink-faint:#9C8E7B;
    --line:#E6D2B7; --accent:#5E7A48; --accent-strong:#3B4E2C; --accent-ink:#FBF6EE;
    --shadow: 0 1px 2px rgba(46,42,32,.08), 0 8px 24px -12px rgba(46,42,32,.22);
  }
  *{box-sizing:border-box;}
  html,body{ background:var(--bg); margin:0; }
  body{
    color:var(--ink); font-family:"Noto Sans KR","Pretendard",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  h1{ font-family:"Gowun Batang","Noto Sans KR",serif; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  header{ padding:18px 28px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:20; }
  header .inner{ max-width:1240px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  header img{ height:32px; }
  .back-link{
    font-size:12.5px; font-weight:700; letter-spacing:.04em; color:var(--ink-soft); text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .back-link:hover{ color:var(--ink); }

  .page-head{ max-width:1240px; margin:0 auto; padding:40px 28px 8px; }
  .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.16em; color:var(--accent); text-transform:uppercase; margin-bottom:10px; }
  h1{ font-size:clamp(22px,3vw,30px); font-weight:700; margin:0 0 8px; }
  .page-head p{ font-size:14px; color:var(--ink-soft); margin:0; }

  .gallery{
    max-width:1240px; margin:0 auto; padding:28px 28px 90px;
    display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;
  }
  @media (max-width:960px){ .gallery{ grid-template-columns:repeat(3, 1fr); } }
  @media (max-width:640px){ .gallery{ grid-template-columns:repeat(2, 1fr); gap:8px; padding:20px 16px 70px; } }

  .g-item{
    position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .g-item img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .35s ease;
  }
  .g-item:hover img{ transform:scale(1.05); }

  /* ---------- 라이트박스 ---------- */
  .lightbox{
    position:fixed; inset:0; background:rgba(20,17,13,.94); z-index:100;
    display:none; align-items:center; justify-content:center;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:min(92vw, 1400px); max-height:88vh; width:auto; height:auto;
    object-fit:contain; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .lb-close, .lb-arrow{
    position:absolute; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.35);
    color:#fff; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;
    line-height:1; transition:background .2s ease;
  }
  .lb-close:hover, .lb-arrow:hover{ background:rgba(255,255,255,.25); }
  .lb-close{ top:20px; right:20px; width:42px; height:42px; font-size:20px; }
  .lb-arrow{ top:50%; transform:translateY(-50%); width:48px; height:48px; font-size:24px; }
  .lb-arrow.prev{ left:16px; } .lb-arrow.next{ right:16px; }
  .lb-counter{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:12.5px; color:rgba(255,255,255,.75); font-variant-numeric:tabular-nums;
  }
  @media (max-width:640px){
    .lb-arrow{ width:38px; height:38px; font-size:19px; }
    .lb-close{ width:36px; height:36px; font-size:18px; top:12px; right:12px; }
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <a href="../index.html"><img src="../images/logo.png" alt="일로디자인 ILLO DESIGN"></a>
    <a class="back-link" href="../index.html">← 홈으로</a>
  </div>
</header>

<div class="page-head">
  <div class="eyebrow">Portfolio · 지식산업센터 오피스인테리어</div>
  <h1>시공사진</h1>
  <p>사진을 클릭하면 크게 볼 수 있습니다.</p>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <button type="button" class="lb-close" id="lb-close" aria-label="닫기">✕</button>
  <button type="button" class="lb-arrow prev" id="lb-prev" aria-label="이전 사진">‹</button>
  <img id="lb-img" src="" alt="일로디자인 오피스인테리어 시공사진">
  <button type="button" class="lb-arrow next" id="lb-next" aria-label="다음 사진">›</button>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<script>
(function(){
  var COUNT = 28;
  var images = [];
  for (var i = 1; i <= COUNT; i++) {
    var num = (i < 10 ? '0' : '') + i;
    images.push('images/office/office-' + num + '.jpg');
  }

  var galleryEl = document.getElementById('gallery');
  images.forEach(function(src, idx){
    var item = document.createElement('div');
    item.className = 'g-item';
    var img = document.createElement('img');
    img.src = src;
    img.alt = '일로디자인 오피스인테리어 시공사진';
    img.loading = 'lazy';
    item.appendChild(img);
    item.addEventListener('click', function(){ openLightbox(idx); });
    galleryEl.appendChild(item);
  });

  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var lbCounter = document.getElementById('lb-counter');
  var current = 0;

  function openLightbox(idx){
    current = idx;
    render();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  function render(){
    lbImg.src = images[current];
    lbCounter.textContent = (current + 1) + ' / ' + images.length;
  }
  function next(){ current = (current + 1) % images.length; render(); }
  function prev(){ current = (current - 1 + images.length) % images.length; render(); }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lb-next').addEventListener('click', next);
  document.getElementById('lb-prev').addEventListener('click', prev);
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });
})();
</script>

</body>
</html>
