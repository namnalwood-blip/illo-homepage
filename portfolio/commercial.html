<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상업공간 인테리어 포트폴리오 — 일로디자인 ILLO DESIGN</title>
<meta name="description" content="일로디자인 상업공간 인테리어 시공사례 포트폴리오. 곧 업데이트될 예정입니다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#FBF3E9; --surface:#FFFFFF; --surface-2:#F5E6D3;
    --ink:#2E2A20; --ink-soft:#6E6252; --ink-faint:#9C8E7B;
    --line:#E6D2B7; --accent:#5E7A48; --accent-strong:#3B4E2C; --accent-ink:#FBF6EE;
  }
  *{box-sizing:border-box;}
  html,body{ background:var(--bg); margin:0; }
  body{
    color:var(--ink); font-family:"Noto Sans KR","Pretendard",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  h1{ font-family:"Gowun Batang","Noto Sans KR",serif; }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  header{ padding:18px 28px; border-bottom:1px solid var(--line); background:var(--surface); }
  header .inner{ max-width:1240px; margin:0 auto; }
  header img{ height:34px; }

  .wrap{ max-width:640px; margin:0 auto; padding:22vh 28px 100px; text-align:center; }
  .eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.16em; color:var(--accent); text-transform:uppercase; margin-bottom:14px; }
  h1{ font-size:clamp(24px,4vw,32px); font-weight:700; margin:0 0 16px; }
  p{ font-size:14.5px; color:var(--ink-soft); margin:0 0 32px; }
  .btn-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; padding:12px 24px; border-radius:24px;
    font-size:13.5px; font-weight:700; text-decoration:none; border:1px solid var(--line);
  }
  .btn.primary{ background:var(--accent-strong); color:var(--accent-ink); border-color:var(--accent-strong); }
  .btn.ghost{ background:var(--surface); color:var(--ink-soft); }
  .btn:hover{ opacity:.88; }
</style>
</head>
<body>

<header><div class="inner"><a href="../index.html"><img src="../images/logo.png" alt="일로디자인 ILLO DESIGN"></a></div></header>

<div class="wrap">
  <div class="eyebrow">Portfolio · 상업공간 인테리어</div>
  <h1>포트폴리오 준비 중입니다</h1>
  <p>상업공간 인테리어 시공사례를 곧 이 페이지에 업데이트할 예정입니다.<br>먼저 상담을 원하시면 아래로 문의해 주세요.</p>
  <div class="btn-row">
    <a class="btn primary" href="tel:01082997830">전화 상담 010-8299-7830</a>
    <a class="btn ghost" href="../index.html#estimate">온라인 견적 보기</a>
  </div>
</div>

</body>
</html>
